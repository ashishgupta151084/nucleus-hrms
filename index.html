<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Nucleus HRMS</title>
  <meta name="theme-color" content="#1B2A5E"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Nucleus HRMS"/>
  <link rel="icon" href="/logo.png"/>
  <link rel="apple-touch-icon" href="/logo.png"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1B2A5E}
    #root{min-height:100vh}
    /* Shown only until React mounts. If this stays on screen, the app failed to load. */
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f7fb}
    #boot img{width:160px;height:auto}
    #boot p{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.12em;color:#5a6b91}
  </style>
</head>
<body>
  <div id="boot">
    <img src="/logo.png" alt="Nucleus"/>
    <p>LOADING…</p>
  </div>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
  <script>
    // Remove the boot screen once React has rendered something.
    var _r = document.getElementById('root');
    new MutationObserver(function(_, obs){
      if (_r && _r.childElementCount > 0) {
        var b = document.getElementById('boot');
        if (b) b.remove();
        obs.disconnect();
      }
    }).observe(_r, {childList:true});
  </script>
</body>
</html>
