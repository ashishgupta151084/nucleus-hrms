name: Deploy Nucleus HRMS to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you re-run it by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check the build produced a site
        run: |
          ls -la dist
          test -f dist/index.html || { echo "::error::dist/index.html missing - the build did not produce a site"; exit 1; }

      # Shows whether the secret is present and which account it is.
      # Prints the identity only - never the key itself.
      - name: Check the Firebase credential
        env:
          SA: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret GOOGLE_APPLICATION_CREDENTIALS_JSON is empty or not set on this repository."
            exit 1
          fi
          echo "secret length: ${#SA} characters"
          printf '%s' "$SA" > /tmp/sa.json
          python3 -c "import json;d=json.load(open('/tmp/sa.json'));print('type        :',d.get('type'));print('project_id  :',d.get('project_id'));print('client_email:',d.get('client_email'));print('private_key :',bool(d.get('private_key')))"
          rm -f /tmp/sa.json

      # Google's own action. It handles authentication itself, which is the part
      # that has been failing.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          projectId: nucleus-hrms
          channelId: live
