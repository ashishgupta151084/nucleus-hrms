name: Deploy Nucleus HRMS to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check the build produced a site
        run: |
          ls -la dist
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }

      # Everything below reports its result as a GitHub *annotation*, which is
      # readable without signing in - unlike the job log.
      - name: Deploy to Firebase
        env:
          SA: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::SECRET MISSING - GOOGLE_APPLICATION_CREDENTIALS_JSON is not set on this repo"
            exit 1
          fi
          printf '%s' "$SA" > "$PWD/sa.json"
          python3 - <<'PY' > ident.txt 2>&1 || true
          import json
          try:
              d=json.load(open("sa.json"))
              print("type=%s project_id=%s client_email=%s private_key=%s" % (
                  d.get("type"), d.get("project_id"), d.get("client_email"), bool(d.get("private_key"))))
          except Exception as e:
              print("SECRET IS NOT VALID JSON:", e)
          PY
          echo "::error::IDENTITY $(cat ident.txt | tr '\n' ' ')"

          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/sa.json"
          npm install -g firebase-tools >/dev/null 2>&1
          echo "::error::CLI $(firebase --version 2>&1 | tail -1)"

          set +e
          firebase projects:list --non-interactive > auth.log 2>&1
          AUTHCODE=$?
          set -e
          if [ $AUTHCODE -ne 0 ]; then
            echo "::error::AUTH FAILED rc=$AUTHCODE :: $(grep -iE 'error|denied|permission|credential|token|api' auth.log | head -4 | tr '\n' ' / ')"
          else
            echo "::error::AUTH OK - the credential can see $(grep -c . auth.log) lines of projects"
          fi

          set +e
          firebase deploy --only hosting --project nucleus-hrms --non-interactive > deploy.log 2>&1
          CODE=$?
          set -e
          echo "===== FULL DEPLOY LOG ====="
          cat deploy.log
          echo "==========================="
          if [ $CODE -ne 0 ]; then
            echo "::error::DEPLOY FAILED rc=$CODE :: $(grep -iE 'error|denied|permission|not found|enable|http|quota|billing' deploy.log | head -6 | cut -c1-220 | tr '\n' ' / ')"
          fi
          rm -f "$PWD/sa.json"
          exit $CODE

      - name: Always remove the credential
        if: always()
        run: rm -f sa.json ident.txt
