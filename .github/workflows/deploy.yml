name: Deploy Nucleus HRMS to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:          # lets you re-run it by hand from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Check the build produced something
        run: |
          echo "--- dist ---"
          ls -la dist
          test -f dist/index.html || { echo "::error::dist/index.html missing - the build did not produce a site"; exit 1; }

      # Checks the credential WITHOUT printing it. Only the service account's
      # identity is shown, never the key.
      - name: Check the Firebase credential
        env:
          SA: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret GOOGLE_APPLICATION_CREDENTIALS_JSON is empty or not set on this repository."
            exit 1
          fi
          echo "secret length: ${#SA} characters"
          printf '%s' "$SA" > service-account.json
          python3 - <<'PY'
          import json,sys
          try:
              d=json.load(open("service-account.json"))
          except Exception as e:
              print("::error::The secret is not valid JSON:",e); sys.exit(1)
          print("type          :",d.get("type"))
          print("project_id    :",d.get("project_id"))
          print("client_email  :",d.get("client_email"))
          print("has private_key:",bool(d.get("private_key")))
          if d.get("project_id")!="nucleus-hrms":
              print("::warning::project_id in the key is",d.get("project_id"),"but we deploy to nucleus-hrms")
          PY

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/service-account.json"
          npm install -g firebase-tools
          firebase --version
          echo "--- can the credential see the project? ---"
          firebase projects:list --non-interactive || echo "::error::Authentication failed - the service account cannot list projects"
          echo "--- deploying ---"
          firebase deploy --only hosting --project nucleus-hrms --non-interactive --debug

      - name: Remove the credential file
        if: always()
        run: rm -f service-account.json
